name: Exportar modelo YOLO a ONNX

on:
  push:
    branches: [main]
    paths:
      - modelos/best.pt
      - scripts/exportar_onnx.py
      - requirements-export.txt
      - .github/workflows/exportar-onnx.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar PyTorch SOLO CPU (en GitHub, nunca en Vercel)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar exportador
        run: python -m pip install -r requirements-export.txt
      - name: Generar best.onnx
        run: python scripts/exportar_onnx.py
      - name: Incorporar modelo ONNX generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modelos/best.onnx
          if git diff --cached --quiet; then
            echo "El modelo ONNX ya estaba actualizado"
          else
            git commit -m "Publicar best.onnx para inferencia Vercel [skip actions]"
            git push origin HEAD:main
          fi
